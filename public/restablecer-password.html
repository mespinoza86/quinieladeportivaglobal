<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nueva contraseña</title>
  <link rel="stylesheet" href="/css/styles.css" />
  <script src="/js/restablecer-password.js" defer></script>
  <script defer src="/js/password-visible.js"></script>
</head>
<body class="app-body auth-page">
  <main class="mobile-shell">
    <section class="hero-card">
      <div class="hero-top">
        <div><p class="eyebrow">Quiniela Deportiva</p><h1>Nueva contraseña</h1></div>
        <div class="app-logo">🔑</div>
      </div>
      <p class="hero-text" id="estado">Elige una contraseña nueva.</p>
    </section>

    <section class="app-panel">
      <form id="restablecerForm">
        <label for="password" class="field-label">Contraseña nueva</label>
        <input type="password" id="password" autocomplete="new-password" minlength="8" required />

        <label for="confirmar" class="field-label">Repítela</label>
        <input type="password" id="confirmar" autocomplete="new-password" minlength="8" required />

        <button type="submit">Guardar contraseña</button>
      </form>

      <p id="mensaje" class="form-message" role="alert"></p>

      <button id="irLogin" class="secondary-button" hidden type="button">Iniciar sesión</button>

      <!--
        Sólo se ofrece pedir otro enlace cuando el que traía falló. Antes de eso
        es ruido: quien llega aquí desde el correo tiene uno que funciona.
      -->
      <button id="pedirOtro" class="secondary-button" hidden type="button">Pedir otro enlace</button>
    </section>
  </main>
</body>
</html>
