<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recuperar contraseña</title>
  <link rel="stylesheet" href="/css/styles.css" />
  <script src="/js/olvide-password.js" defer></script>
</head>
<body class="app-body auth-page">
  <main class="mobile-shell">
    <section class="hero-card">
      <div class="hero-top">
        <div><p class="eyebrow">Quiniela Deportiva</p><h1>Recuperar contraseña</h1></div>
        <div class="app-logo">🔑</div>
      </div>
      <p class="hero-text">Te enviamos un enlace para elegir una nueva.</p>
    </section>

    <section class="app-panel">
      <form id="olvideForm">
        <label for="email" class="field-label">Tu correo</label>
        <input id="email" type="email" autocomplete="email" required />
        <button type="submit">Enviarme el enlace</button>
      </form>

      <p id="mensaje" class="form-message" role="status"></p>

      <button id="irLogin" class="secondary-button" type="button">Volver a iniciar sesión</button>
    </section>
  </main>
</body>
</html>
