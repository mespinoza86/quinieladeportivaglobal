<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar sesión</title>
  <link rel="stylesheet" href="/css/styles.css" />
  <script src="/js/login.js" defer></script>
</head>
<body class="app-body auth-page">
  <main class="mobile-shell">
    <section class="hero-card">
      <div class="hero-top"><div><p class="eyebrow">Quiniela Deportiva</p><h1>Iniciar sesión</h1></div><div class="app-logo">🔐</div></div>
      <p class="hero-text">Entra con tu nombre de usuario o correo electrónico.</p>
    </section>
    <section class="app-panel">
      <form id="loginForm">
        <label for="identificador" class="field-label">Usuario o correo</label>
        <input id="identificador" autocomplete="username" required />
        <label for="password" class="field-label">Contraseña</label>
        <input type="password" id="password" autocomplete="current-password" required />
        <button type="submit">Iniciar sesión</button>
        <p id="errorMessage" class="form-message" role="alert"></p>
      </form>
      <p class="helper-text">¿No tienes cuenta?</p>
      <button id="registroButton" class="secondary-button" type="button">Crear una cuenta</button>
    </section>
  </main>
</body>
</html>
