<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crear cuenta</title>
  <link rel="stylesheet" href="/css/styles.css" />
  <script src="/js/registro.js" defer></script>
<script defer src="/js/password-visible.js"></script>
</head>
<body class="app-body auth-page">
  <main class="mobile-shell">
    <section class="hero-card"><div class="hero-top"><div><p class="eyebrow">Nueva cuenta</p><h1>Regístrate</h1></div><div class="app-logo">👤</div></div></section>
    <section class="app-panel">
      <form id="registroForm">
        <label class="field-label" for="username">Nombre de usuario</label>
        <input id="username" minlength="3" maxlength="30" autocomplete="username" required />
        <label class="field-label" for="email">Correo electrónico</label>
        <input type="email" id="email" autocomplete="email" required />
        <label class="field-label" for="password">Contraseña</label>
        <input type="password" id="password" minlength="8" autocomplete="new-password" required />
        <label class="field-label" for="confirmarPassword">Confirmar contraseña</label>
        <input type="password" id="confirmarPassword" minlength="8" autocomplete="new-password" required />
        <button type="submit">Crear cuenta</button>
        <p id="registroMensaje" class="form-message" role="alert"></p>
      </form>
      <button onclick="window.location.href='/login.html'" class="ghost-button" type="button">Ya tengo cuenta</button>
    </section>
  </main>
</body>
</html>
