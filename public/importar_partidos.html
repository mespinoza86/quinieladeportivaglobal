<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Importar Partidos</title>

  <link rel="stylesheet" href="css/styles.css" />
<script src="js/navegacion.js" defer></script>
<script src="js/html-seguro.js" defer></script>
  <script src="js/importar_partidos.js" defer></script>
</head>

<body class="app-body">

  <main class="mobile-shell wide-shell">

    <section class="hero-card">
      <div class="hero-top">
        <div>
          <p class="eyebrow">API Football</p>
          <h1>Importar Partidos</h1>
        </div>

        <div class="app-logo">🌎</div>
      </div>

      <p class="hero-text">
        Busca partidos reales de los próximos días y filtra por torneo.
      </p>
    </section>

    <section class="app-panel">

      <div class="two-column">

        <div>
          <label class="field-label" for="fechaInput">Desde</label>
          <input type="date" id="fechaInput" />
        </div>

        <div>
          <label class="field-label" for="torneoSelect">Torneo</label>

          <!--
            Antes aquí había una lista de unos veinte torneos escrita a mano, con
            el país y el nombre de la competición incrustados. La llena ahora el
            servidor con las ligas que DE VERDAD tienen partidos en el rango
            (Fase C): así no hay opciones muertas cuando el proveedor renombra
            una competición, y aparecen solas las que antes no estaban.
          -->
          <select id="torneoSelect">
            <option value="">Cargando torneos…</option>
          </select>
        </div>

      </div>

      <div id="customLeagueBox" style="display:none;margin-top:16px;">
        <label class="field-label" for="customLeagueNameInput">Texto del torneo</label>
        <input
          type="text"
          id="customLeagueNameInput"
          placeholder="Ej: Copa, Apertura, Libertadores, Champions"
        />
      </div>

      <div style="margin-top:20px;">
        <button id="buscarPartidosButton" type="button">
          Buscar Partidos
        </button>
      </div>

      <p class="helper-text" id="rangoTexto">
        Se buscan los partidos de los próximos 7 días.
      </p>

    </section>

    <section class="app-panel">
      <h2>Partidos Disponibles</h2>

      <div id="estadoBusqueda" class="info-card" style="display:none;"></div>

      <div id="partidosContainer" class="matches-container"></div>
    </section>

    <section class="app-panel">

      <h2>Crear Jornada</h2>

      <div class="two-column">

        <div>
          <label class="field-label" for="nombreJornadaInput">Nombre Jornada</label>
          <input type="text" id="nombreJornadaInput" placeholder="Ej: Jornada34" />
        </div>

      </div>

      <button id="crearJornadaButton" type="button">
        Crear Jornada desde API
      </button>

      <button data-ir-a="adminmode.html" class="ghost-button" type="button">
        Volver
      </button>

    </section>

  </main>

  <nav class="bottom-nav">
    <a href="index.html">🏠<span>Inicio</span></a>
    <a href="ver_jornadas.html">📅<span>Jornadas</span></a>
    <a href="resultados-totales.html">🏆<span>Tabla</span></a>
    <a href="adminmode.html" class="active">⚙️<span>Admin</span></a>
  </nav>

</body>
</html>
