<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Admin Trivias</title>

  <link rel="stylesheet" href="/css/styles.css" />
  <script src="/js/admin_trivias.js" defer></script>
</head>

<body class="app-body">
  <main class="mobile-shell wide-shell">

    <section class="hero-card">
      <div class="hero-top">
        <div>
          <p class="eyebrow">Modo administrador</p>
          <h1>Administrar Trivias</h1>
        </div>
        <div class="app-logo">❓</div>
      </div>

      <p class="hero-text">
        Crea, modifica o elimina trivias por jornada. Si eliminas una trivia, también se borran sus respuestas y puntos.
      </p>
    </section>

    <section class="app-panel">

      <label class="field-label" for="jornadaSelect">Jornada</label>
      <select id="jornadaSelect"></select>

      <label class="field-label" for="fechaCierre">Fecha cierre de trivia</label>
      <input id="fechaCierre" type="datetime-local" />

      <div id="partidosTriviaContainer" class="trivias-container"></div>

      <div class="button-stack">
        <button id="guardarCambiosBtn" type="button">Guardar Cambios de Trivias</button>
        <button id="resolverTriviasBtn" class="secondary-button" type="button">Resolver Trivias Ahora</button>
        <button onclick="window.location.href='adminmode.html'" class="ghost-button" type="button">Volver</button>
      </div>

      <p id="mensaje" class="form-message"></p>
    </section>

  </main>

  <nav class="bottom-nav">
    <a href="index.html">
      🏠
      <span>Inicio</span>
    </a>

    <a href="ver_jornadas.html">
      📅
      <span>Jornadas</span>
    </a>

    <a href="reglamento_quiniela.html">
      📜
      <span>Reglamento</span>
    </a>

    <a href="resultados-totales.html">
      🏆
      <span>Tabla</span>
    </a>
  </nav>
</body>
</html>
