<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tabla por jornada</title>
  <link rel="stylesheet" href="/css/styles.css" />
  <script defer src="/js/clasificacion-jornada.js"></script>
</head>
<body class="app-body">
  <main class="mobile-shell wide-shell">
    <section class="hero-card">
      <div class="hero-top">
        <div>
          <p class="eyebrow">Clasificación</p>
          <h1>Tabla por jornada</h1>
        </div>
        <div class="app-logo">🥇</div>
      </div>
      <p class="hero-text">Consulta la posición de cada jugador en una jornada específica.</p>
    </section>

    <section class="app-panel">
      <label for="jornadaSelect" class="field-label">Jornada</label>
      <select id="jornadaSelect"></select>
      <p id="estadoJornada" class="helper-text" aria-live="polite"></p>

      <div class="tabla-contenedor">
        <table id="clasificacionJornadaTable">
          <thead>
            <tr>
              <th>Puesto</th>
              <th>Jugador</th>
              <th>Puntos</th>
              <th>Exactos</th>
              <th>Resultados</th>
              <th>Diferencia de goles</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
      <button id="volverButton" class="ghost-button" type="button">Volver</button>
    </section>
  </main>

  <nav class="bottom-nav">
    <a href="index.html">🏠<span>Inicio</span></a>
    <a href="ver_jornadas.html">📅<span>Jornadas</span></a>
    <a href="clasificacion-jornada.html" class="active">🥇<span>Por jornada</span></a>
    <a href="resultados-totales.html">🏆<span>Tabla</span></a>
  </nav>
</body>
</html>
