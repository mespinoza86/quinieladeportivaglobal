<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Enviar Trivias</title>

  <link rel="stylesheet" href="/css/styles.css" />
  <script src="/js/enviarresultadostrivias.js" defer></script>
</head>

<body class="app-body">
  <main class="mobile-shell">
    <section class="hero-card">
      <div class="hero-top">
        <div>
          <p class="eyebrow">Compartir</p>
          <h1>Respuestas de Trivias</h1>
        </div>
        <div class="app-logo">🎯</div>
      </div>

      <p class="hero-text">
        Copia o envía por WhatsApp las respuestas de trivia por jornada.
      </p>
    </section>

    <section class="app-panel">
      <h2>Copiar Respuestas de Trivia</h2>

      <label for="jornadaSelect" class="field-label">Selecciona Jornada</label>
      <select id="jornadaSelect">
        <option value="">-- Selecciona --</option>
      </select>

      <div class="button-stack">
        <button id="copiarResultadosButton" type="button">Copiar Trivias</button>
        <button id="enviarWhatsappButton" class="secondary-button" type="button">Enviar por WhatsApp</button>
        <button onclick="window.location.href='adminmode.html'" class="ghost-button" type="button">Volver</button>
      </div>

      <textarea id="resultadoTexto" rows="14" placeholder="Aquí aparecerá el texto generado..."></textarea>
    </section>
  </main>

  <nav class="bottom-nav">
    <a href="index.html">🏠<span>Inicio</span></a>
    <a href="ver_jornadas.html">📅<span>Jornadas</span></a>
    <a href="resultados-totales.html">🏆<span>Tabla</span></a>
    <a href="adminmode.html" class="active">⚙️<span>Admin</span></a>
  </nav>
</body>
</html>
